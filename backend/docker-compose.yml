version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: enbon-minio
    ports:
      - "9000:9000"      # API 端口
      - "9001:9001"      # Console 端口
    environment:
      MINIO_ROOT_USER: enbonadmin
      MINIO_ROOT_PASSWORD: EnbonAdmin2026!
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # 可选：mc 客户端（用于创建 bucket 和管理）
  minio-client:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 enbonadmin EnbonAdmin2026!;
      mc mb local/enbon-files --ignore-existing;
      mc anonymous set download local/enbon-files;
      mc mb local/enbon-temp --ignore-existing;
      exit 0;
      "

volumes:
  minio-data:
    driver: local
