version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enbon-postgres
    environment:
      POSTGRES_USER: enbon
      POSTGRES_PASSWORD: EnbonAdmin2026
      POSTGRES_DB: enbon_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: